# The Xcode project for the iPad app. Generate it with `xcodegen generate` in this directory (see ios/README.md);
# Typle.xcodeproj is not committed.
name: Typle
options:
  bundleIdPrefix: io.github.sparklingstadt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  createIntermediateGroups: true
packages:
  TypleCore:
    path: TypleCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.56.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Typle:
    type: application
    platform: iOS
    sources:
      - path: Typle
    dependencies:
      - package: TypleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sparklingstadt.typle
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Typle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        # The web app may run on a Mac on the same network (http://<name>.local:3000) while trying it out.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Typle が同じネットワークの開発用の Typle に接続するために使います。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Typle/Info.plist
      properties:
        CFBundleLocalizations: [ja, en]
        CFBundleAllowMixedLocalizations: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  # Only turns the simulator for the screenshots in .github/workflows/ios.yml (see OrientationTests.swift).
  TypleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TypleUITests
    dependencies:
      - target: Typle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sparklingstadt.typle.uitests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Typle:
    build:
      targets:
        Typle: all
        TypleUITests: [test]
    test:
      targets:
        - TypleUITests
