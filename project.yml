# The Xcode project for the iPad and Mac apps. Generate it with `xcodegen generate` in this directory (see README.md);
# Typle.xcodeproj is not committed. Both apps build the same SwiftUI sources (Shared/) and the rules they share with the
# web app (TypleCore/); each one's own parts are in iPad/ and Mac/.
name: Typle
options:
  bundleIdPrefix: io.github.sparklingstadt
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: ja
  createIntermediateGroups: true
packages:
  TypleCore:
    path: TypleCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.63.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TypleiPad:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iPad
        excludes:
          - Info.plist
    dependencies:
      - package: TypleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sparklingstadt.typle
        PRODUCT_NAME: Typle
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Typle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        # The web app may run on a Mac on the same network (http://<name>.local:3000) while trying it out.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Typle が同じネットワークの開発用の Typle に接続するために使います。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: iPad/Info.plist
      properties:
        CFBundleLocalizations: [ja, en]
        CFBundleAllowMixedLocalizations: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TypleMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
        excludes:
          - Info.plist
          - Typle.entitlements
    dependencies:
      - package: TypleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sparklingstadt.typle
        PRODUCT_NAME: Typle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Typle
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # The web app may run on this Mac or one on the same network (http://<name>.local:3000) while trying it out.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Typle が同じネットワークの開発用の Typle に接続するために使います。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Signed to run locally (ad hoc), so the app builds and runs without choosing a development team. Choose one in
        # Signing & Capabilities to sign with your own certificate instead.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Mac/Typle.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
    info:
      path: Mac/Info.plist
      properties:
        CFBundleLocalizations: [ja, en]
        CFBundleAllowMixedLocalizations: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  # Only turns the simulator for screenshots (see OrientationTests.swift).
  TypleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TypleUITests
    dependencies:
      - target: TypleiPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sparklingstadt.typle.uitests
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  TypleiPad:
    build:
      targets:
        TypleiPad: all
        TypleUITests: [test]
    test:
      targets:
        - TypleUITests
  TypleMac:
    build:
      targets:
        TypleMac: all
